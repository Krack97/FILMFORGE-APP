name: Build Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preserve development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: filmforge-development-signing-v1
      - name: Build and check
        working-directory: FILMFORGE-APP-v0.1.0
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bundled neural model
        working-directory: FILMFORGE-APP-v0.1.0
        run: |
          pip install onnxruntime==1.20.1 numpy==2.1.3
          python - <<'PY'
          import hashlib, pathlib, numpy as np, onnxruntime as ort
          path=pathlib.Path("app/src/main/assets/super-resolution.onnx")
          assert hashlib.sha256(path.read_bytes()).hexdigest()=="85f36ff88cc504a24af5e0602148bc56a8aa09a58eca8c0da2756f3e8186035e"
          session=ort.InferenceSession(str(path), providers=["CPUExecutionProvider"])
          for h,w in [(96,128),(72,128),(128,72)]:
              data=np.random.default_rng(42).random((1,1,h,w),dtype=np.float32)
              out=session.run(None,{session.get_inputs()[0].name:data})[0]
              assert out.shape==(1,1,h*3,w*3),out.shape
              assert np.isfinite(out).all()
              nearest=np.repeat(np.repeat(data,3,axis=2),3,axis=3)
              assert np.mean(np.abs(out-nearest))>1e-5
              print("Neural x3 inference passed", data.shape, out.shape)
          PY
      - name: Enable accelerated Android test device
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android GPU and on-device inference
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd FILMFORGE-APP-v0.1.0 && gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Upload Android test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-tests
          path: FILMFORGE-APP-v0.1.0/app/build/reports/androidTests/connected/debug
          if-no-files-found: ignore
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FILMFORGE-Android
          path: FILMFORGE-APP-v0.1.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-checks
          path: FILMFORGE-APP-v0.1.0/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
