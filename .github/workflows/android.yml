name: Build Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preserve development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: filmforge-development-signing-v1
      - name: Fetch verified neural source and notices
        working-directory: FILMFORGE-APP-v0.1.0
        run: gradle --no-daemon :app:prepareNeuralAssets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bundled neural model
        working-directory: FILMFORGE-APP-v0.1.0
        run: |
          pip install onnx==1.17.0 onnxruntime==1.20.1 numpy==2.1.3
          python - <<'PY'
          import hashlib, json, pathlib, numpy as np, onnx, onnxruntime as ort
          from onnx import helper, TensorProto
          source=pathlib.Path("app/build/models/super-resolution-source.onnx")
          digest=hashlib.sha256(source.read_bytes()).hexdigest()
          assert digest=="85f36ff88cc504a24af5e0602148bc56a8aa09a58eca8c0da2756f3e8186035e"
          original=onnx.load(str(source))
          conv=[n for n in original.graph.node if n.op_type=="Conv"]
          assert len(conv)==4, "Unexpected neural architecture"
          last=conv[-1]
          nodes=[]
          for node in original.graph.node:
              nodes.append(node)
              if node.output[0] == last.output[0]:
                  break
          # Preserve every trained convolution/activation; replace only fixed-shape pixel shuffle.
          nodes.append(helper.make_node("DepthToSpace",[last.output[0]],["reconstructed_y"],blocksize=3))
          graph=helper.make_graph(nodes,"FilmForgeDynamicSubPixelCNN",
              [helper.make_tensor_value_info(original.graph.input[0].name,TensorProto.FLOAT,[1,1,"height","width"])],
              [helper.make_tensor_value_info("reconstructed_y",TensorProto.FLOAT,[1,1,"out_height","out_width"])],
              initializer=list(original.graph.initializer))
          adapted=helper.make_model(graph,opset_imports=list(original.opset_import))
          adapted.ir_version=original.ir_version
          onnx.checker.check_model(adapted)
          assets=pathlib.Path("app/src/main/assets");assets.mkdir(parents=True,exist_ok=True)
          path=assets/"super-resolution.onnx";onnx.save(adapted,str(path))
          baseline=ort.InferenceSession(str(source),providers=["CPUExecutionProvider"])
          session=ort.InferenceSession(str(path),providers=["CPUExecutionProvider"])
          reference=np.random.default_rng(7).random((1,1,224,224),dtype=np.float32)
          old=baseline.run(None,{baseline.get_inputs()[0].name:reference})[0]
          new=session.run(None,{session.get_inputs()[0].name:reference})[0]
          error=float(np.max(np.abs(old-new)))
          assert error<1e-4, ("Pixel shuffle conversion changed predictions",error)
          for h,w in [(96,128),(72,128),(128,72)]:
              data=np.random.default_rng(42).random((1,1,h,w),dtype=np.float32)
              out=session.run(None,{session.get_inputs()[0].name:data})[0]
              assert out.shape==(1,1,h*3,w*3),out.shape
              assert np.isfinite(out).all()
              nearest=np.repeat(np.repeat(data,3,axis=2),3,axis=3)
              assert np.mean(np.abs(out-nearest))>1e-5
              print("Neural x3 inference passed",data.shape,out.shape)
          (assets/"MODEL-PROVENANCE.json").write_text(json.dumps({
              "source_sha256":digest,"adapted_sha256":hashlib.sha256(path.read_bytes()).hexdigest(),
              "change":"Dynamic input/output layout and equivalent DepthToSpace pixel shuffle; trained weights unchanged",
              "maximum_prediction_difference_at_224":error},indent=2))
          print("Original/adapted maximum prediction difference:",error)
          PY
      - name: Build and check
        working-directory: FILMFORGE-APP-v0.1.0
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Enable accelerated Android test device
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android GPU and on-device inference
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd FILMFORGE-APP-v0.1.0 && gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Upload Android test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-tests
          path: FILMFORGE-APP-v0.1.0/app/build/reports/androidTests/connected/debug
          if-no-files-found: ignore
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FILMFORGE-Android
          path: FILMFORGE-APP-v0.1.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-checks
          path: FILMFORGE-APP-v0.1.0/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
