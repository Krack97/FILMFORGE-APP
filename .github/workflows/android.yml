name: Build Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and check
        working-directory: FILMFORGE-APP-v0.1.0
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FILMFORGE-Android
          path: FILMFORGE-APP-v0.1.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-checks
          path: FILMFORGE-APP-v0.1.0/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
